<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check list Tributos — e-Sfinge</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #1a3a6b; --blue-mid: #1e4a8a; --blue-light: #e8f0fe;
      --green:   #16a34a; --green-bg: #dcfce7;
      --orange:  #d97706; --orange-bg: #fef3c7;
      --red:     #dc2626; --red-bg: #fde8e8;
      --gray:    #6b7280; --gray-bg: #f0f2f5;
      --border:  #e2e8f0; --shadow: 0 2px 10px rgba(0,0,0,.07);
    }

    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--gray-bg); color: #1a1a2e; min-height: 100vh; }

    /* ── Topbar ── */
    .topbar { background: var(--blue); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 10px; }
    .topbar a { color: rgba(255,255,255,.7); text-decoration: none; font-size: .82rem; }
    .topbar a:hover { color: #fff; }
    .topbar-sep { color: rgba(255,255,255,.3); margin: 0 4px; }
    .topbar-icon { width: 32px; height: 32px; background: rgba(255,255,255,.15); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .topbar-title { font-weight: 700; font-size: .92rem; }
    .topbar-tag { font-size: .68rem; background: rgba(255,255,255,.15); padding: 2px 8px; border-radius: 99px; margin-left: 4px; }

    /* ── Entity bar ── */
    .entity-bar {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }
    .entity-info { flex: 1; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .entity-name { font-weight: 700; font-size: .9rem; color: var(--blue); }
    .entity-chip { font-size: .75rem; color: var(--gray); background: var(--gray-bg); padding: 3px 10px; border-radius: 99px; }
    .iter-badge  { font-size: .72rem; font-weight: 700; background: var(--blue-light); color: var(--blue); padding: 3px 10px; border-radius: 99px; }
    .cred-chip   { font-size: .73rem; color: #555; background: #fef3c7; padding: 3px 10px; border-radius: 99px; border: 1px solid #fcd34d; display: inline-flex; align-items: center; gap: 5px; }
    .btn-copy-cred { background: none; border: none; cursor: pointer; font-size: .75rem; padding: 0 2px; color: var(--orange); transition: .15s; }
    .btn-copy-cred:hover { color: #92400e; }
    .entity-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ── Phase tabs ── */
    .phase-nav { background: #fff; border-bottom: 2px solid var(--border); padding: 0 20px; display: flex; gap: 0; overflow-x: auto; }
    .phase-tab {
      padding: 13px 20px; font-size: .82rem; font-weight: 700; cursor: pointer;
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      color: var(--gray); white-space: nowrap; display: flex; align-items: center; gap: 6px;
      transition: .15s; user-select: none;
    }
    .phase-tab:hover  { color: var(--blue); }
    .phase-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
    .phase-count { font-size: .68rem; background: var(--gray-bg); padding: 1px 6px; border-radius: 99px; font-weight: 700; }
    .phase-tab.active .phase-count { background: var(--blue-light); color: var(--blue); }

    /* ── Main content ── */
    .main           { max-width: 900px; margin: 0 auto; padding: 20px 20px 80px; }
    .main.full-width { max-width: none; padding: 14px 16px 80px; }

    /* ── Setup panel ── */
    .setup-panel {
      background: #fff; border-radius: 12px; box-shadow: var(--shadow);
      padding: 32px; text-align: center; margin-top: 20px;
    }
    .setup-panel h2 { color: var(--blue); margin-bottom: 8px; }
    .setup-panel p  { color: var(--gray); font-size: .85rem; margin-bottom: 20px; }
    .setup-row { display: flex; gap: 10px; justify-content: center; align-items: flex-end; flex-wrap: wrap; }
    .setup-field label { display: block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #555; margin-bottom: 4px; }
    .setup-field select, .setup-field input { padding: 8px 11px; border: 1.5px solid var(--border); border-radius: 7px; font-size: .88rem; background: #fafbfc; }
    .setup-field select:focus, .setup-field input:focus { outline: none; border-color: var(--blue); }

    /* ── Step card ── */
    .etapa-card {
      background: #fff; border-radius: 10px; box-shadow: var(--shadow);
      border-left: 4px solid #e2e8f0; margin-bottom: 8px;
      overflow: hidden; transition: border-color .2s;
    }
    .etapa-card.ok        { border-left-color: var(--green); }
    .etapa-card.com_erros { border-left-color: var(--orange); }
    .etapa-card.pendente  { border-left-color: #cbd5e1; }

    .etapa-header { display: flex; align-items: center; gap: 10px; padding: 13px 16px; }
    .etapa-codigo { font-size: .72rem; font-weight: 700; color: var(--gray); background: var(--gray-bg); padding: 2px 7px; border-radius: 5px; white-space: nowrap; flex-shrink: 0; }
    .etapa-nome   { flex: 1; font-size: .84rem; font-weight: 600; color: #1a1a2e; line-height: 1.4; }
    .etapa-status-icon { font-size: 1rem; flex-shrink: 0; }

    .etapa-actions { display: flex; gap: 6px; padding: 0 16px 12px; }
    .etapa-card.ok .etapa-actions, .etapa-card.com_erros .etapa-actions { display: none; }

    /* ── Buttons ── */
    .btn { padding: 7px 14px; border: none; border-radius: 7px; font-size: .78rem; font-weight: 700; cursor: pointer; transition: .15s; display: inline-flex; align-items: center; gap: 5px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-ok     { background: var(--green-bg); color: var(--green); }
    .btn-ok:hover { background: #bbf7d0; }
    .btn-erros  { background: var(--orange-bg); color: var(--orange); }
    .btn-erros:hover { background: #fde68a; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-mid); }
    .btn-ghost  { background: var(--gray-bg); color: #374151; }
    .btn-ghost:hover { background: var(--border); }
    .btn-danger { background: var(--red-bg); color: var(--red); }
    .btn-sm     { padding: 4px 10px; font-size: .73rem; }

    /* ── Undo button (after marking) ── */
    .etapa-undo { display: flex; align-items: center; gap: 8px; padding: 0 16px 10px; }
    .etapa-card.pendente .etapa-undo { display: none; }
    .undo-label { font-size: .75rem; color: var(--gray); }
    .btn-undo { background: none; border: 1px solid var(--border); color: var(--gray); border-radius: 5px; padding: 2px 8px; font-size: .72rem; cursor: pointer; }
    .btn-undo:hover { border-color: var(--red); color: var(--red); }

    /* ── Errors section ── */
    .erros-section { border-top: 1px solid var(--border); padding: 12px 16px; background: #fffbf0; display: none; }
    .etapa-card.com_erros .erros-section { display: block; }
    .erro-item { background: #fff; border: 1px solid #fcd34d; border-radius: 7px; padding: 10px 12px; margin-bottom: 8px; position: relative; }
    .erro-item-num  { font-size: .68rem; font-weight: 700; color: var(--orange); text-transform: uppercase; margin-bottom: 4px; }
    .erro-desc-label, .erro-sol-label { font-size: .68rem; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: .03em; margin-top: 6px; margin-bottom: 2px; }
    .erro-desc-val, .erro-sol-val { font-size: .82rem; color: #374151; line-height: 1.5; white-space: pre-wrap; }
    .btn-rem-erro { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #aaa; font-size: 1rem; cursor: pointer; padding: 2px 5px; border-radius: 4px; }
    .btn-rem-erro:hover { color: var(--red); background: var(--red-bg); }

    .erro-form { background: #fff; border: 1.5px dashed #fcd34d; border-radius: 7px; padding: 12px; margin-top: 8px; }
    .erro-form.hidden { display: none; }
    .erro-form textarea, .erro-form input { width: 100%; padding: 7px 10px; border: 1.5px solid var(--border); border-radius: 6px; font-size: .82rem; font-family: inherit; margin-bottom: 8px; resize: vertical; }
    .erro-form textarea:focus, .erro-form input:focus { outline: none; border-color: var(--orange); }
    .erro-form-row { display: flex; gap: 6px; }

    /* ── Barra de ação da fase (Todos OK) ── */
    .fase-action-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }

    /* ── Split layout (Enviando) — colunas redimensionáveis ── */
    .split-layout { display: grid; grid-template-columns: var(--split-w, 360px) 10px 1fr; gap: 6px; align-items: stretch; }
    @media (max-width: 900px) { .split-layout { grid-template-columns: 1fr; } .split-gutter { display: none; } }
    .split-steps { min-width: 0; }
    /* Divisor arrastável */
    .split-gutter {
      cursor: col-resize;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; background: var(--gray-bg); transition: background .15s;
      position: sticky; top: 10px; height: calc(100vh - 160px);
    }
    .split-gutter:hover, .split-gutter.dragging { background: var(--blue-light); }
    .split-gutter .grip { width: 3px; height: 40px; border-radius: 99px; background: #cbd5e1; transition: background .15s; }
    .split-gutter:hover .grip, .split-gutter.dragging .grip { background: var(--blue); }

    .viewer-card { background: #fff; border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; position: sticky; top: 10px; }
    .viewer-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: #f8fafc; flex-wrap: wrap; }
    .viewer-title  { font-size: .82rem; font-weight: 700; color: var(--blue); flex: 1; }
    .viewer-actions { display: flex; align-items: center; gap: 6px; }
    .viewer-ts { font-size: .68rem; color: var(--gray); }
    .viewer-body { height: calc(100vh - 200px); min-height: 520px; position: relative; }
    .viewer-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; color: var(--gray); text-align: center; padding: 20px; }
    .viewer-empty .icon { font-size: 2.5rem; }
    .viewer-empty p { font-size: .83rem; }
    #resultado-iframe { width: 100%; height: 100%; border: none; display: block; }

    /* ── Bottom bar ── */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fff; border-top: 1px solid var(--border);
      padding: 10px 20px; display: flex; align-items: center; gap: 14px;
      box-shadow: 0 -2px 10px rgba(0,0,0,.06); z-index: 50;
    }
    .progress-text { font-size: .78rem; color: var(--gray); }
    .progress-bar-wrap { flex: 1; max-width: 200px; background: #e9ecef; border-radius: 99px; height: 6px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--blue); border-radius: 99px; transition: width .3s; }
    .btn-md { padding: 9px 18px; font-size: .82rem; }

    /* ── Modals ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: #fff; border-radius: 14px; padding: 28px; width: 100%; max-width: 500px; box-shadow: 0 8px 40px rgba(0,0,0,.2); max-height: 90vh; overflow-y: auto; }
    .modal-box.wide { max-width: 720px; }
    .modal-title { font-size: 1.05rem; font-weight: 700; color: var(--blue); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #555; margin-bottom: 5px; }
    .modal-field input { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .9rem; }
    .modal-field input:focus { outline: none; border-color: var(--blue); }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* History */
    .hist-group { margin-bottom: 16px; }
    .hist-group-title { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--gray); margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
    .hist-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--gray-bg); border-radius: 8px; margin-bottom: 5px; }
    .hist-item-info { flex: 1; }
    .hist-item-title { font-size: .82rem; font-weight: 600; }
    .hist-item-sub   { font-size: .72rem; color: var(--gray); margin-top: 2px; }
    .hist-status-ok   { color: var(--green); }
    .hist-status-and  { color: var(--blue); }
    .hist-status-done { color: var(--gray); }

    /* ── Seletor de execução ── */
    .btn-seletor {
      background: var(--blue-light); border: 1.5px solid #c7d9f8;
      color: var(--blue); border-radius: 8px; padding: 7px 14px;
      font-size: .82rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 4px; max-width: 420px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: .15s;
    }
    .btn-seletor:hover { background: #dbeafe; }
    .seletor-dropdown {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 100;
      background: #fff; border: 1.5px solid var(--border); border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,.12); min-width: 360px; max-width: 520px;
      overflow: hidden;
    }
    .seletor-dropdown.hidden { display: none; }
    .seletor-item {
      display: flex; align-items: center; gap: 10px; padding: 11px 14px;
      cursor: pointer; transition: background .12s; border-bottom: 1px solid #f0f2f5;
    }
    .seletor-item:last-child { border-bottom: none; }
    .seletor-item:hover { background: var(--blue-light); }
    .seletor-item.ativo { background: #eff6ff; }
    .seletor-item-info { flex: 1; overflow: hidden; }
    .seletor-item-title { font-size: .82rem; font-weight: 700; color: #1a1a2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seletor-item-sub   { font-size: .72rem; color: var(--gray); margin-top: 2px; }
    .seletor-check { color: var(--blue); font-size: 1rem; flex-shrink: 0; }

    /* ── Tela de seleção ── */
    .selecao-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 18px; }
    .selecao-head h2 { color: var(--blue); font-size: 1.15rem; flex: 1; }
    .selecao-section-title { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--gray); margin: 18px 0 10px; display: flex; align-items: center; gap: 6px; }
    .selecao-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    .exec-card {
      background: #fff; border-radius: 12px; box-shadow: var(--shadow);
      border-left: 4px solid #cbd5e1; padding: 16px; display: flex; flex-direction: column; gap: 10px;
      transition: transform .12s, box-shadow .12s;
    }
    .exec-card.andamento { border-left-color: var(--blue); }
    .exec-card.com_erros { border-left-color: var(--orange); }
    .exec-card.concluido { border-left-color: var(--green); opacity: .85; }
    .exec-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
    .exec-card-top { display: flex; align-items: flex-start; gap: 8px; }
    .exec-card-ent { flex: 1; font-weight: 700; font-size: .92rem; color: var(--blue); line-height: 1.3; }
    .exec-card-statusicon { font-size: 1.1rem; flex-shrink: 0; }
    .exec-card-meta { display: flex; flex-wrap: wrap; gap: 6px; }
    .exec-chip { font-size: .72rem; color: #475569; background: var(--gray-bg); padding: 3px 9px; border-radius: 99px; display: inline-flex; align-items: center; gap: 4px; }
    .exec-chip.ug { background: var(--blue-light); color: var(--blue); }
    .exec-chip.chamado { background: #ecfeff; color: #0e7490; cursor: pointer; text-decoration: none; }
    .exec-chip.chamado:hover { background: #cffafe; }
    .exec-card-progress { display: flex; align-items: center; gap: 8px; }
    .exec-card-progress .bar { flex: 1; height: 6px; background: #e9ecef; border-radius: 99px; overflow: hidden; }
    .exec-card-progress .fill { height: 100%; background: var(--blue); border-radius: 99px; }
    .exec-card.concluido .exec-card-progress .fill { background: var(--green); }
    .exec-card.com_erros .exec-card-progress .fill { background: var(--orange); }
    .exec-card-progress .ptxt { font-size: .7rem; color: var(--gray); white-space: nowrap; }
    .exec-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
    .exec-card-upd { font-size: .68rem; color: #94a3b8; }
    .selecao-empty { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 40px 24px; text-align: center; }
    .selecao-empty .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .selecao-empty p { color: var(--gray); font-size: .88rem; margin-bottom: 18px; }

    /* Toast */
    .toast { position: fixed; bottom: 72px; right: 20px; background: #15803d; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: .82rem; font-weight: 600; z-index: 400; box-shadow: 0 4px 14px rgba(0,0,0,.2); animation: toastIn .2s; }
    @keyframes toastIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

    /* Responsive */
    @media (max-width: 600px) {
      .phase-tab { padding: 10px 12px; font-size: .75rem; }
      .etapa-header { padding: 10px 12px; }
    }
  </style>
</head>
<body>

<!-- ── Modal: Execução (entidade + competência + credenciais, tudo junto) ── -->
<div class="modal-overlay hidden" id="modal-exec">
  <div class="modal-box">
    <div class="modal-title" id="modal-exec-title">➕ Nova execução</div>

    <!-- Escolher entidade já usada (somente no modo "nova") -->
    <div class="modal-field" id="exec-picker-wrap">
      <label>Entidade</label>
      <select id="exec-picker" onchange="aoEscolherEntidade()"
              style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem">
        <option value="__nova__">➕ Nova entidade…</option>
      </select>
    </div>

    <div class="modal-field">
      <label>Nome da entidade</label>
      <input type="text" id="exec-nome" placeholder="MUNICIPIO DE X">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="modal-field">
        <label>Código da UG</label>
        <input type="text" id="exec-ug" placeholder="12351">
      </div>
      <div class="modal-field">
        <label>ID da entidade</label>
        <input type="text" id="exec-id" placeholder="39">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="modal-field">
        <label>Município</label>
        <input type="text" id="exec-municipio" placeholder="São Lourenço do Oeste">
      </div>
      <div class="modal-field">
        <label>Competência</label>
        <div style="display:flex;gap:6px">
          <select id="exec-mes" style="flex:1;padding:9px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem">
            <option value="01">01 — Jan</option><option value="02">02 — Fev</option>
            <option value="03">03 — Mar</option><option value="04">04 — Abr</option>
            <option value="05">05 — Mai</option><option value="06">06 — Jun</option>
            <option value="07">07 — Jul</option><option value="08">08 — Ago</option>
            <option value="09">09 — Set</option><option value="10">10 — Out</option>
            <option value="11">11 — Nov</option><option value="12">12 — Dez</option>
          </select>
          <input type="text" id="exec-ano" value="2026" maxlength="4" style="width:70px;padding:9px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem">
        </div>
      </div>
    </div>
    <div class="modal-field">
      <label>Caminho do arquivo de resultados (opcional)</label>
      <input type="text" id="exec-caminho" placeholder="C:\Ferramentinhas\resultado.html">
    </div>

    <div style="border-top:1px solid var(--border);margin:14px 0 14px;padding-top:14px">
      <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--orange);margin-bottom:10px">
        🔒 Credenciais — salvas só neste computador, por UG
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="modal-field">
          <label>Usuário</label>
          <input type="text" id="exec-usuario" placeholder="usuario@betha.com.br" autocomplete="off">
        </div>
        <div class="modal-field">
          <label>Senha</label>
          <input type="password" id="exec-senha" placeholder="••••••••" autocomplete="new-password">
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-exec-cancelar" onclick="fecharModalExec()">Cancelar</button>
      <button class="btn btn-primary" id="btn-exec-salvar" onclick="salvarExec()">▶ Criar execução</button>
    </div>
  </div>
</div>

<!-- ── Modal: Histórico ── -->
<div class="modal-overlay hidden" id="modal-historico">
  <div class="modal-box wide">

let _dados      = { historico: [] };   // só histórico de execuções (cada uma carrega sua entidade)

/* Credenciais ficam SÓ neste computador, indexadas por código da UG. Nunca vão ao Firestore. */
const LS_CRED = 'checklist-cred-v1';
let _creds    = {};
function carregarCreds() { try { _creds = JSON.parse(localStorage.getItem(LS_CRED) || '{}'); } catch { _creds = {}; } }
function salvarCreds()   { try { localStorage.setItem(LS_CRED, JSON.stringify(_creds)); } catch {} }

/* Roteador central de render: decide entre a tela de seleção e o fluxo de execução */
function render() {
  if (_view === 'selecao') { renderizarSelecao(); return; }

/* Roteador central de render: decide entre a tela de seleção e o fluxo de execução */
function render() {
  if (_view === 'selecao') { renderizarSelecao(); return; }
  renderizarTudo();
}

/* ══════════════════════════════════════════════
   FIREBASE — INICIALIZAÇÃO E SINCRONIZAÇÃO
══════════════════════════════════════════════ */
function iniciarFirebase() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    _db = firebase.firestore();

    _db.collection(FB_COLECAO)
      .orderBy('dataInicio', 'asc')
      .onSnapshot(snap => {
        const idAtual = _iter?._docId;
        _dados.historico = snap.docs.map(doc => ({ ...doc.data(), _docId: doc.id }));
        // Mantém a execução selecionada (se o usuário já escolheu uma).
        // NÃO auto-seleciona: ao entrar, mostramos a tela de seleção.
        if (idAtual) {
          _iter = _dados.historico.find(i => i._docId === idAtual) || null;
          if (!_iter) _view = 'selecao';  // execução sumiu → volta à seleção
        }
        render();
      }, err => {
        if (err.code === 'permission-denied') {
          toast('⚠️ Sem permissão no banco. Verifique as regras do Firestore.');
        } else { console.warn('Firestore:', err); }
      });
  } catch (e) {
    console.warn('Firebase não inicializado:', e);
  }
}

async function salvar() {
  if (!_db || !_iter) return;
  const { _docId, ...dados } = _iter;
  // Adiciona timestamp automático de última atualização
  dados.updatedAt = new Date().toISOString();
  try {
    if (_docId) {
      await _db.collection(FB_COLECAO).doc(_docId).set(dados);
    }
  } catch (e) {
    console.warn('Erro ao salvar:', e);
  }
}

/* ══════════════════════════════════════════════
   CRIAÇÃO DE EXECUÇÃO
══════════════════════════════════════════════ */
// Mesma entidade = mesmo código da UG (ou, sem UG, mesmo nome)
function mesmaEntidade(a, b) {
  if (!a || !b) return false;
  if (a.codigoUg && b.codigoUg) return a.codigoUg === b.codigoUg;
  return (a.nome || '') === (b.nome || '');
}

async function criarIteracao(competencia, entidade, caminhoResultados) {
  // Conta iterações da MESMA entidade na MESMA competência
  const existentes = _dados.historico.filter(i =>
    i.competencia === competencia && mesmaEntidade(i.entidade, entidade));
  const numIter = existentes.length + 1;
  const nova = {
    entidade:           { ...entidade },
    competencia,        iteracao: numIter,
    dataInicio:         new Date().toISOString(),
    dataFim:            null,
    status:             'em_andamento',
    linkChamado:        '',
    caminhoResultados:  caminhoResultados || '',
    updatedAt:          new Date().toISOString(),
    fases:              {}
  };
  for (const fase of FASES) {
    nova.fases[fase] = DEF[fase].map(e => ({
      codigo: e.codigo, nome: e.nome, status: 'pendente', erros: []
    }));
  }
  if (_db) {
    try {
      const ref = await _db.collection(FB_COLECAO).add(nova);
      nova._docId = ref.id;
    } catch (e) { console.warn('Erro ao criar execução:', e); }
  }
  _dados.historico.push(nova);
  _iter = nova;
}

/* ══════════════════════════════════════════════

async function marcarTodosOk() {
  if (!_iter) return;
  const etapas    = _iter.fases[_fase];
  const pendentes = etapas.filter(e => e.status === 'pendente');
  if (!pendentes.length) return;
  if (!confirm(`Marcar ${pendentes.length} etapa(s) pendente(s) como OK?`)) return;
  pendentes.forEach(e => { e.status = 'ok'; });
  await salvar();
  renderizarFase();
  atualizarTabs();
  atualizarBarraInferior();
}

async function marcarEtapa(fase, idx, status) {
  const etapa = _iter.fases[fase][idx];
  if (!etapa) return;
  etapa.status = status;
  await salvar();
  renderizarFase();
  atualizarTabs();
  atualizarBarraInferior();
}

async function resetarEtapa(fase, idx) {
  const etapa = _iter.fases[fase][idx];
  if (!etapa) return;
  etapa.status = 'pendente';
  etapa.erros  = [];
  await salvar();
  renderizarFase();
  atualizarTabs();
  atualizarBarraInferior();
}

async function adicionarErro(fase, idx, descricao, solucao) {
  const etapa = _iter.fases[fase][idx];
  if (!etapa || !descricao.trim()) return;
  etapa.erros.push({ id: uid(), descricao: descricao.trim(), solucao: solucao.trim() });
  etapa.status = 'com_erros';
  await salvar();
  renderizarFase();
  atualizarTabs();
  atualizarBarraInferior();
}

async function removerErro(fase, etapaIdx, erroId) {
  const etapa = _iter.fases[fase][etapaIdx];
  if (!etapa) return;
  etapa.erros = etapa.erros.filter(e => e.id !== erroId);
  if (!etapa.erros.length) etapa.status = 'pendente';
  await salvar();
  renderizarFase();
  atualizarTabs();
  atualizarBarraInferior();
}

/* Mostra/oculta os elementos que pertencem só à visão de execução */
function setChromeExecucao(visivel) {
  document.getElementById('link-bar').style.display       = visivel ? '' : 'none';
  document.getElementById('phase-nav').style.display      = visivel ? '' : 'none';
  document.getElementById('btn-trocar-exec').style.display = visivel ? '' : 'none';
  document.getElementById('btn-editar-exec').style.display = visivel ? '' : 'none';
  if (!visivel) {
    document.getElementById('bottom-bar').style.display = 'none';
    document.getElementById('cred-chip').style.display  = 'none';
  }
}

function renderizarTudo() {
  // Sem execução selecionada → volta à tela de seleção (não existe mais "entidade global")
  if (!_iter) { _view = 'selecao'; renderizarSelecao(); return; }

  document.getElementById('btn-editar-exec').style.display = '';

  carregarLinkChamado();
  atualizarTabs();

  const main = document.querySelector('.main');
  if (main) main.classList.toggle('full-width', _fase === 'enviando');
  renderizarFase();
  atualizarBarraInferior();
  document.getElementById('bottom-bar').style.display = '';
}

/* ── Tela de seleção (home) ── */
function renderizarSelecao() {
  setChromeExecucao(false);
  atualizarEntityBar();
  const main = document.querySelector('.main');
  if (main) main.classList.remove('full-width');

  const ativas     = _dados.historico.filter(i => i.status === 'em_andamento');
  const concluidas = _dados.historico
    .filter(i => i.status === 'concluido')
    .sort((a,b) => new Date(b.updatedAt||b.dataInicio) - new Date(a.updatedAt||a.dataInicio));

  let html = `
    <div class="selecao-head">
      <h2>📋 Selecione uma execução</h2>
      <button class="btn btn-ghost btn-sm" onclick="abrirModalHistorico()">📋 Histórico completo</button>
      <button class="btn btn-primary btn-sm" onclick="novaIteracao()">➕ Nova execução</button>
    </div>`;

  if (!ativas.length && !concluidas.length) {
    html += `
      <div class="selecao-empty">
        <div class="icon">📭</div>
        <p>Nenhuma execução ainda. Crie a primeira para começar o controle de envio.</p>
        <button class="btn btn-primary" onclick="novaIteracao()">➕ Nova execução</button>
      </div>`;
  } else {
    if (ativas.length) {
      html += `<div class="selecao-section-title">🔄 Em andamento (${ativas.length})</div>`;
      html += `<div class="selecao-grid">` + ativas.map(renderExecCard).join('') + `</div>`;
    }
    if (concluidas.length) {
      html += `<div class="selecao-section-title">✅ Concluídas (${concluidas.length})</div>`;
      html += `<div class="selecao-grid">` + concluidas.map(renderExecCard).join('') + `</div>`;
    }
  }

  document.getElementById('main-content').innerHTML = html;
}

function renderExecCard(iter) {
  const e = iter.entidade || {};
  const [ano, mes] = (iter.competencia || '-').split('-');
  const meses = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const numeral = ['','1ª','2ª','3ª','4ª','5ª','6ª','7ª','8ª','9ª'];

  // Progresso e status agregado
  let total = 0, concl = 0, temErro = false;
  for (const fase of FASES) {
    const etapas = iter.fases?.[fase] || [];
    total += etapas.length;
    concl += etapas.filter(x => x.status !== 'pendente').length;
    if (etapas.some(x => x.status === 'com_erros')) temErro = true;
  }
  const pct = total > 0 ? Math.round(concl / total * 100) : 0;

  let cls, icon;
  if (iter.status === 'concluido') { cls = 'concluido'; icon = '✅'; }
  else if (temErro)                { cls = 'com_erros'; icon = '⚠️'; }
  else                             { cls = 'andamento'; icon = '🔄'; }

  const updStr = iter.updatedAt
    ? new Date(iter.updatedAt).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
    : new Date(iter.dataInicio).toLocaleDateString('pt-BR');

  const chamadoChip = iter.linkChamado
    ? `<a class="exec-chip chamado" href="${escAttr(iter.linkChamado)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 Chamado</a>`
    : '';
  const ugChip = e.codigoUg ? `<span class="exec-chip ug">UG ${escHtml(e.codigoUg)}</span>` : '';

  return `
  <div class="exec-card ${cls}">
    <div class="exec-card-top">
      <div class="exec-card-ent">${escHtml(e.nome || '— sem entidade —')}</div>
      <span class="exec-card-statusicon">${icon}</span>
    </div>
    <div class="exec-card-meta">
      ${ugChip}
      <span class="exec-chip">📅 ${meses[parseInt(mes)] || mes}/${ano}</span>
      <span class="exec-chip">🔁 ${numeral[iter.iteracao] || iter.iteracao + 'ª'} iter.</span>
      ${chamadoChip}
    </div>
    <div class="exec-card-progress">
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      <span class="ptxt">${concl}/${total} · ${pct}%</span>
    </div>
    <div class="exec-card-foot">
      <span class="exec-card-upd">atualizado ${updStr}</span>
      <button class="btn btn-primary btn-sm" onclick="selecionarIteracao('${iter._docId}')">▶ Tocar nesta</button>
    </div>
  </div>`;
}

function voltarSelecao() {
  fecharSeletor();
  _view = 'selecao';
  _iter = null;
  render();
}

function setFase(fase) {
  _fase = fase;
  document.querySelectorAll('.phase-tab').forEach(t => t.classList.toggle('active', t.dataset.fase === fase));
  // Largura total no Enviando, normal nas demais
  const main = document.querySelector('.main');
  if (main) main.classList.toggle('full-width', fase === 'enviando');
  renderizarFase();
}

function renderizarFase() {
  if (!_iter) return;
  const etapas    = _iter.fases[_fase];
  const pendentes = etapas.filter(e => e.status === 'pendente').length;
  const barraAcao = pendentes > 0
    ? `<div class="fase-action-bar">
        <button class="btn btn-ok btn-sm" onclick="marcarTodosOk()">✅ Marcar todos como OK (${pendentes})</button>
       </div>`
    : '';
  const stepsHtml = barraAcao + etapas.map((e, idx) => renderEtapaCard(e, idx)).join('');

  if (_fase === 'enviando') {
    document.getElementById('main-content').innerHTML = `
      <div class="split-layout">
        <div class="split-steps">${stepsHtml}</div>
        <div class="split-gutter" title="Arraste para ajustar · dê duplo-clique para resetar"
             onmousedown="iniciarResize(event)" ondblclick="resetarSplit()"><div class="grip"></div></div>
        <div>${renderViewerPanel()}</div>
      </div>`;
    aplicarSplitWidth();
    // Restaura iframe se já tinha arquivo carregado
    if (_blobUrl) {
      document.getElementById('viewer-empty').style.display  = 'none';
      document.getElementById('resultado-iframe').style.display = '';
      document.getElementById('resultado-iframe').src = _blobUrl;
      document.getElementById('btn-atualizar').disabled = false;
    }
  } else {
    document.getElementById('main-content').innerHTML = stepsHtml;
  }
}

function renderViewerPanel() {
  return `<div class="viewer-card">
    <div class="viewer-header">
      <span class="viewer-title">📄 Resultado do lote</span>

/* ── Redimensionamento do split (Enviando) ── */
const SPLIT_LS = 'checklist-split-w';
const SPLIT_DEFAULT = 360;

function aplicarSplitWidth() {
  const layout = document.querySelector('.split-layout');
  if (!layout) return;
  const w = parseInt(localStorage.getItem(SPLIT_LS) || SPLIT_DEFAULT, 10);
  layout.style.setProperty('--split-w', w + 'px');
}

function iniciarResize(ev) {
  ev.preventDefault();
  const layout = document.querySelector('.split-layout');
  const gutter = ev.currentTarget;
  if (!layout) return;
  gutter.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';

  const onMove = (e) => {
    const rect = layout.getBoundingClientRect();
    let w = e.clientX - rect.left;
    const min = 240;
    const max = Math.max(min, rect.width - 320);  // garante espaço mínimo ao visualizador
    w = Math.max(min, Math.min(max, w));
    layout.style.setProperty('--split-w', w + 'px');
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    gutter.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    const cur = parseInt(layout.style.getPropertyValue('--split-w'), 10);
    if (cur) localStorage.setItem(SPLIT_LS, cur);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function resetarSplit() {
  localStorage.removeItem(SPLIT_LS);
  aplicarSplitWidth();
  toast('↔️ Largura restaurada');
}

/* ── Viewer de resultado do lote ── */
async function selecionarArquivoResultado() {
  // File System Access API (Chrome/Edge) — mantém handle para re-leitura
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'Resultado HTML', accept: { 'text/html': ['.html', '.htm'] } }],
        multiple: false,
      });
      _fileHandle = handle;
      await atualizarResultado();
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // usuário cancelou
    }
  }
  // Fallback: input file clássico (Firefox / outros)
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.html,.htm';
  input.onchange = async () => {
    if (!input.files[0]) return;
    await _carregarFileObject(input.files[0]);
  };
  input.click();
}

async function atualizarResultado() {
  try {
    let file;
    if (_fileHandle) {
      file = await _fileHandle.getFile();
    } else return;
    await _carregarFileObject(file);
  } catch (e) {
    toast('Erro ao atualizar: ' + e.message);
  }
}

async function _carregarFileObject(file) {
  const content = await file.text();
  // Libera blob anterior
  if (_blobUrl) URL.revokeObjectURL(_blobUrl);
  _blobUrl = URL.createObjectURL(new Blob([content], { type: 'text/html' }));

  const iframe = document.getElementById('resultado-iframe');
  const empty  = document.getElementById('viewer-empty');
  const btnAt  = document.getElementById('btn-atualizar');
  const ts     = document.getElementById('viewer-ts');

  if (iframe) {
    iframe.src = _blobUrl;
    iframe.style.display = '';
  }
  if (empty)  empty.style.display  = 'none';
  if (btnAt)  btnAt.disabled = false;
  if (ts)     ts.textContent = `Atualizado: ${new Date().toLocaleTimeString('pt-BR')}`;
}

/* ── Tabs update ── */
function atualizarTabs() {
  if (!_iter) return;
  for (const fase of FASES) {
    const etapas  = _iter.fases[fase];
    const total   = etapas.length;
    const concl   = etapas.filter(e => e.status !== 'pendente').length;
    const temErro = etapas.some(e => e.status === 'com_erros');
    const tudo_ok = concl === total && !temErro;
    const icon    = tudo_ok ? '✅' : temErro ? '⚠️' : concl > 0 ? '🔄' : '';
    const cnt = document.getElementById(`cnt-${fase}`);
    if (cnt) cnt.textContent = `${concl}/${total}`;
    const tab = document.querySelector(`.phase-tab[data-fase="${fase}"]`);
    if (tab) {
      const label = { gerando:'📤 Gerando', validando:'🔍 Validando', enviando:'📨 Enviando', finalizando:'🏁 Finalizando' }[fase];
      tab.childNodes[0].textContent = (icon ? icon + ' ' : '') + label + ' ';
    }
  }
}

        <span style="font-size:1rem">🔄</span>

  }

  dd.classList.remove('hidden');

function fecharSeletor() {
  document.getElementById('seletor-dropdown').classList.add('hidden');
}

function _fecharSeletorFora(e) {
  if (!document.getElementById('seletor-dropdown').contains(e.target) &&
      !document.getElementById('btn-seletor').contains(e.target)) {
    fecharSeletor();
  }
}

function progresso(iter) {
  let total = 0, concl = 0;
  for (const fase of FASES) {
    total += iter.fases[fase].length;
    concl += iter.fases[fase].filter(e => e.status !== 'pendente').length;
  }
  return `${concl}/${total} etapas`;
}

/* ══════════════════════════════════════════════
   MODAL DE EXECUÇÃO (entidade + competência + credenciais)
══════════════════════════════════════════════ */
// Lista de entidades distintas já usadas (mais recentes primeiro)
function entidadesUsadas() {
  const vistas = [];
  for (let k = _dados.historico.length - 1; k >= 0; k--) {
    const e = _dados.historico[k].entidade;
    if (!e || !e.nome) continue;
    if (vistas.some(v => mesmaEntidade(v, e))) continue;
    vistas.push(e);
  }
  return vistas;
}

function abrirModalExec(mode) {
  _execMode = mode;
  const editar = mode === 'editar';
  document.getElementById('modal-exec-title').textContent = editar ? '✏️ Editar execução' : '➕ Nova execução';
  document.getElementById('btn-exec-salvar').textContent  = editar ? '💾 Salvar alterações' : '▶ Criar execução';
  document.getElementById('exec-picker-wrap').style.display = editar ? 'none' : '';

  let ent = {}, comp = '';
  if (editar && _iter) { ent = _iter.entidade || {}; comp = _iter.competencia || ''; }

  // Popular o seletor de entidades já usadas (modo novo)
  if (!editar) {
    const usadas = entidadesUsadas();
    const sel = document.getElementById('exec-picker');
    sel.innerHTML = '<option value="__nova__">➕ Nova entidade…</option>' +
      usadas.map((e, i) => `<option value="${i}">${escHtml(e.nome)}${e.codigoUg ? ' — UG ' + escHtml(e.codigoUg) : ''}</option>`).join('');
    sel._usadas = usadas;
    // Pré-seleciona a entidade mais recente, se houver
    if (usadas.length) { sel.value = '0'; ent = usadas[0]; }
    else sel.value = '__nova__';
  }

  preencherCamposExec(ent, comp);
  document.getElementById('btn-exec-cancelar').style.display = (editar || _dados.historico.length) ? '' : 'none';
  document.getElementById('modal-exec').classList.remove('hidden');
  setTimeout(() => document.getElementById('exec-nome').focus(), 50);
}

function preencherCamposExec(ent, comp) {
  ent = ent || {};
  document.getElementById('exec-nome').value      = ent.nome      || '';
  document.getElementById('exec-ug').value        = ent.codigoUg  || '';
  document.getElementById('exec-id').value        = ent.idEntidade || '';
  document.getElementById('exec-municipio').value = ent.municipio || '';
  document.getElementById('exec-caminho').value   = (_iter && _execMode === 'editar' ? _iter.caminhoResultados : ent.caminhoResultados) || '';
  // Competência: usa a da execução (editar) ou o mês atual (novo)
  const hoje = new Date();
  const [ano, mes] = (comp || `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`).split('-');
  document.getElementById('exec-mes').value = mes;
  document.getElementById('exec-ano').value = ano;
  // Credenciais locais da UG
  const c = credsDaUG(ent.codigoUg);
  document.getElementById('exec-usuario').value = c.usuario || '';
  document.getElementById('exec-senha').value   = c.senha   || '';
}

function aoEscolherEntidade() {
  const sel = document.getElementById('exec-picker');
  if (sel.value === '__nova__') {
    preencherCamposExec({}, '');
    setTimeout(() => document.getElementById('exec-nome').focus(), 30);
  } else {
    const ent = (sel._usadas || [])[parseInt(sel.value, 10)];
    if (ent) preencherCamposExec(ent, document.getElementById('exec-ano').value && document.getElementById('exec-mes').value
      ? `${document.getElementById('exec-ano').value}-${document.getElementById('exec-mes').value}` : '');
  }
}

function fecharModalExec() {
  document.getElementById('modal-exec').classList.add('hidden');
}

async function salvarExec() {
  const nome = document.getElementById('exec-nome').value.trim();
  const ano  = document.getElementById('exec-ano').value.trim();
  const mes  = document.getElementById('exec-mes').value;
  if (!nome) { alert('Informe o nome da entidade.'); return; }
  if (!ano.match(/^\d{4}$/)) { alert('Informe um ano válido (AAAA).'); return; }

  const ug = document.getElementById('exec-ug').value.trim();
  const entidade = {
    nome,
    codigoUg:   ug,
    codigo:     ug,   // compatibilidade com versões anteriores
    idEntidade: document.getElementById('exec-id').value.trim(),
    municipio:  document.getElementById('exec-municipio').value.trim(),
  };
  const caminho     = document.getElementById('exec-caminho').value.trim();
  const competencia = `${ano}-${mes}`;

  // Credenciais → salvas SÓ localmente, indexadas por UG
  const usuario = document.getElementById('exec-usuario').value.trim();
  const senha   = document.getElementById('exec-senha').value.trim();
  if (ug && (usuario || senha)) { _creds[ug] = { usuario, senha }; salvarCreds(); }

  if (_execMode === 'editar' && _iter) {
    _iter.entidade          = entidade;
    _iter.competencia       = competencia;
    _iter.caminhoResultados = caminho;
    await salvar();
  } else {
    await criarIteracao(competencia, entidade, caminho);
    _view = 'execucao';
  }
  fecharModalExec();
  render();
}

/* Copiar credenciais da execução atual */
function copiarCred(qual) {
  const ug = _iter?.entidade?.codigoUg;
  const c  = credsDaUG(ug);
  const val = qual === 'senha' ? c.senha : c.usuario;
  if (!val) { toast('Nenhuma ' + (qual === 'senha' ? 'senha' : 'usuário') + ' salvo para esta UG'); return; }
  navigator.clipboard.writeText(val)
    .then(() => toast((qual === 'senha' ? '🔑 Senha' : '👤 Usuário') + ' copiado'))
    .catch(() => alert(val));
}

   MODAL HISTÓRICO

function abrirModalHistorico() {
  const hist = _dados.historico;
  if (!hist.length) {
    document.getElementById('historico-conteudo').innerHTML = '<p style="color:var(--gray);text-align:center;padding:20px">Nenhum registro ainda.</p>';
  } else {
    // Group by competencia
    const grupos = {};
    hist.forEach(i => { (grupos[i.competencia] = grupos[i.competencia] || []).push(i); });
    let html = '';
    for (const [comp, iters] of Object.entries(grupos).reverse()) {
      const [ano, mes] = comp.split('-');
      const meses = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
      html += `<div class="hist-group"><div class="hist-group-title">${meses[parseInt(mes)]}/${ano}</div>`;
      iters.forEach(i => {
        const total  = FASES.reduce((s,f) => s + i.fases[f].length, 0);
        const concl  = FASES.reduce((s,f) => s + i.fases[f].filter(e=>e.status!=='pendente').length, 0);
        const erros  = FASES.reduce((s,f) => s + i.fases[f].filter(e=>e.status==='com_erros').length, 0);
        const datStr = new Date(i.dataInicio).toLocaleDateString('pt-BR');
        const stCls  = i.status === 'em_andamento' ? 'hist-status-and' : erros ? 'hist-status-done' : 'hist-status-ok';
        const stIco  = i.status === 'em_andamento' ? '🔄' : erros ? '⚠️' : '✅';
        html += `<div class="hist-item">
          <span style="font-size:1.2rem">${stIco}</span>
          <div class="hist-item-info">
            <div class="hist-item-title ${stCls}">${i.iteracao}ª iteração ${i.status === 'em_andamento' ? '(em andamento)' : ''}</div>
            <div class="hist-item-sub">Iniciado em ${datStr} · ${concl}/${total} etapas · ${erros} com erros</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="exportarIteracao('${i.id}')">📄 Markdown</button>
        </div>`;
      });
      html += '</div>';
    }
    document.getElementById('historico-conteudo').innerHTML = html;
  }
  document.getElementById('modal-historico').classList.remove('hidden');
}

function fecharModalHistorico() {
  document.getElementById('modal-historico').classList.add('hidden');
}

function exportarIteracao(id) {
  const iter = _dados.historico.find(i => i.id === id);
  if (!iter) return;
  const md = construirMarkdown(iter);
  navigator.clipboard.writeText(md).then(() => {
    fecharModalHistorico();
    toast('📋 Markdown copiado!');
  }).catch(() => alert(md));
}

/* ══════════════════════════════════════════════
   GERAÇÃO DE MARKDOWN
══════════════════════════════════════════════ */
function gerarMarkdown() {
  if (!_iter) return;
  const md = construirMarkdown(_iter);
  navigator.clipboard.writeText(md).then(() => toast('📋 Markdown copiado para o clipboard!')).catch(() => {
    // Fallback: show in modal
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px';
    box.innerHTML = `<div style="background:#fff;border-radius:12px;padding:20px;max-width:700px;width:100%;max-height:80vh;overflow-y:auto">
      <div style="font-weight:700;margin-bottom:10px">📄 Markdown gerado (copie manualmente):</div>
      <textarea style="width:100%;height:300px;font-family:monospace;font-size:.78rem;border:1px solid #ddd;border-radius:6px;padding:10px" readonly>${md}</textarea>
      <div style="margin-top:10px;text-align:right"><button onclick="this.closest('div[style]').remove()" style="padding:7px 16px;background:#1a3a6b;color:#fff;border:none;border-radius:7px;cursor:pointer">Fechar</button></div>
    </div>`;
    document.body.appendChild(box);
  });
}

function construirMarkdown(iter) {
  const e = iter.entidade || {};
  const [ano, mes] = iter.competencia.split('-');
  const meses = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const numeral = ['','1ª','2ª','3ª','4ª','5ª','6ª','7ª','8ª','9ª'];
  const datStr = new Date(iter.dataInicio).toLocaleDateString('pt-BR');
  const hn = (n) => numeral[n] || `${n}ª`;

  let md = `# e-Sfinge Tributos — ${e.nome || 'Entidade'}\n`;
  md += `**Competência:** ${meses[parseInt(mes)]}/${ano}`;
  if (e.codigoUg) md += ` | **UG:** ${e.codigoUg}`;
  md += ` | **Iteração:** ${hn(iter.iteracao)} | **Data:** ${datStr}`;
  if (iter.linkChamado) md += ` | **Chamado:** ${iter.linkChamado}`;
  md += `\n\n---\n\n`;

  const FASE_ICONS = { gerando:'📤', validando:'🔍', enviando:'📨', finalizando:'🏁' };

  for (const fase of FASES) {
    const etapas = iter.fases[fase];
    const temAlgo = etapas.some(e => e.status !== 'pendente');
    if (!temAlgo) continue;

    md += `## ${FASE_ICONS[fase]} ${FASE_LABELS[fase]}\n\n`;
    etapas.forEach(etapa => {
      if (etapa.status === 'pendente') return;
      const icone = etapa.status === 'ok' ? '✅' : '⚠️';
      const label = etapa.status === 'ok' ? 'OK' : 'COM ERROS';
      md += `${icone} **[${etapa.codigo}]** ${etapa.nome} — *${label}*\n`;
      if (etapa.erros.length) {
        etapa.erros.forEach((err, i) => {
          md += `\n> **Erro ${i+1}:** ${err.descricao}\n`;
          if (err.solucao) md += `> **Solução:** ${err.solucao}\n`;
        });
        md += '\n';
      }
    });
    md += '\n---\n\n';
  }

  md += `*Gerado em ${new Date().toLocaleString('pt-BR')} pelo Check list Tributos — e-Sfinge*\n`;
  return md;
}

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
function uid() {
  return 'xxxx-xxxx-4xxx-yxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0; return (c==='x' ? r : (r&0x3|0x8)).toString(16);
  });
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escAttr(s) {
  return escHtml(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

const FASE_LABELS_MAP = { gerando:'Gerando', validando:'Validando', enviando:'Enviando', finalizando:'Finalizando' };
